<!DOCTYPE html>

<head>
<meta charset="utf-8" />
<title>2026 World Cup Simulator</title>
<style>
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding:18px; background:#f6f7fb; color:#111; }
  h1,h2,h3 { text-align:center; margin:8px 0; }
  .controls { display:flex; gap:8px; justify-content:center; margin-bottom:12px; align-items:center; }
  .groups { display:grid; grid-template-columns: repeat(6, 1fr); gap:20px; justify-content:center; }
  .group { width:260px; background:#fff; border:1px solid #e6e9ef; border-radius:10px; padding:10px; box-shadow:0 6px 18px rgba(15,20,40,0.04); }
  table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  th, td{ padding:6px; border-bottom:1px solid #f1f2f6; text-align:left; }
  input[type=number]{ width:50px;}
  .team {display: flex; align-items: center; /* vertically center contents */gap: 2px; /* space between name and flag */min-width: 60px; /* reserve horizontal space for name + flag */}
  .team strong {display: inline-block; width: 3ch;/* fixed width for 3-letter country code */}
  .team img {width: 20px; height: 14px;}
  .team-wrapper {display: flex; align-items:center;}
  .team-wrapper img {width: 20px; height: 14px; flex-shrink: 0; /* prevent shrinking */}
  .match-team-left .team-wrapper strong, .match-team-right .team-wrapper strong {display: inline-block; width: 3ch; /* keep fixed width for team code */ text-align: left;}
  .match-team-left, .match-team-right {display: flex; align-items: center; width: 100px; /* fixed width to align all inputs */}
  .match-team-right {display: flex; /* flag on right */ justify-content: flex-end; gap: 6px;}
  .match-team-right img {width: 20px; height: 14px;flex-shrink: 0; /* prevents the flag from shrinking */}
  .match-score {flex-grow: 1; /* take remaining space */ display: flex; justify-content: center; /* center inputs */ align-items: center; gap: 10px;}
  .match-row {display: grid; grid-template-columns: 120px 40px 120px; /* left | score | right */ align-items: center; gap: 4px;}
  .bracket{ display:flex; gap:18px; justify-content:center; margin-top:20px; position:relative; flex-wrap:wrap; }
  .espn-bracket {overflow: visible; display: flex; justify-content: center; align-items: stretch; /* make left/right sides stretch */ width: 100%; gap: 18px;} /* ESPN-style symmetric bracket */
  .bracket-side {overflow: visible; display: flex; gap: 12px; align-items: center;} /* side column stack container (left/right contain multiple round columns) */
  .bracket-side.right { flex-direction: row-reverse; } /* right side: we reverse order of columns visually so outermost round is leftmost */
  .bracket-round {overflow: visible; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 150px;} /* each round column */
  .bracket-round h4 {margin: 0 0 6px 0; font-size: 13px; font-weight: 600; text-align: center;} /* round header */
  .bracket-slot {padding-right: 50px; opacity: 1; position: relative; width: 150px; background: #fff; border: 1px solid #e6e9ef; border-radius: 6px; padding: 6px; box-shadow: 0 2px 6px rgba(10,15,30,0.03);} /* individual match box */
  .bracket-slot .team-row {display:flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 2px 0;} /* team row in slot */
  .bracket-slot .team-row.tbd { opacity: 0.55; color: #666; } /* lighter style when team is TBD */
  .bracket-slot .team-row.winner { background: linear-gradient(90deg,#e9f7ef,#ffffff); border-radius:4px; } /* provisional winner styling */
  .bracket-slot .team-row.loser {opacity: 0.45; color: #888;}
  .bracket-slot img { width:16px; height:11px; margin-left:6px;} /* flag sizing */
  .bracket-final .final-slot {width: 180px; background:#fff; border:1px solid #e6e9ef; border-radius:8px; padding:8px;}
  .bracket-final-wrapper {display: flex; flex-direction: column; justify-content: center; /* vertical center Final */ align-items: center; gap: 16px; /* space between Final and Bronze */ min-width: 180px; height:100%; transform: translateY(93px); /*Shift block down by ~20px to compensate for the Bronze card*/}
  .bracket-final-wrapper .bracket-final {width: 100%; background:#fff; border:5px solid #FFD700; padding:8px; display: flex; flex-direction: column; align-items: center; font-weight: 400;}
  .bracket-final-wrapper .bracket-bronze {width: 90%; background: #fdf6e3; border: 1px solid #e6d8b0; border-radius: 8px; padding: 10px; text-align: center; font-weight: 400; color: #b87333;}
  .bracket-side .bracket-round:nth-child(4) {display: flex; flex-direction: column; flex-grow: 1; justify-content: center;}
  .bracket-final .champion {margin-top:8px; font-weight:700; color:#0b5e3b;}
  .knockout-name-block {width: 80px; /* fixed column for name+flag */ display: flex; align-items: center; gap: 4px; flex-shrink: 0;}
  .knockout-score-block {
  width: 30px;                 /* fixed width for the score input */
  display: flex;
  justify-content: center;
  flex-shrink: 0;              /* DO NOT shrink when layout changes */
  margin-right: 0;             /* remove the 100% hack */
}

  .round{ display:flex; flex-direction:column; align-items:center; min-width:220px; }
  .match{ background:#fff; border-left:2px solid #eceff6; padding:8px; margin:8px 0; min-width:200px; position:relative; border-radius:6px; }
  .prob{ font-size:12px; color:#666; margin-top:6px; text-align:center; }
  .winner-team{ background:linear-gradient(90deg,#e6f5ea,#fff); }
  .arrow{ position:absolute; height:2px; background:#9aa7c7; transform-origin:left top; border-radius:2px; }
  #champion-probs { max-width:800px; margin:12px auto; background:#fff; border-radius:10px; padding:10px; box-shadow:0 6px 18px rgba(15,20,40,0.04); }
  .progress { text-align:center; margin-top:8px; font-size:13px; color:#333; }
  button { background:#2b6cff; color:#fff; padding:8px 12px; border-radius:8px; border:0; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .small { font-size:12px; color:#666; }
  .trophy-header-images {display: flex; justify-content: center; /* Horizontally center the images */ align-items: center; gap: 10px; /* Space between the two images */ margin-top: 5px; margin-bottom: 5px; /* Tight spacing above the new Knockout Stage title */}
  .trophy-image {width: 200px; height: auto; /* Adjust size to your preference */}
  /* --- tooltip CSS --- */
  .tooltip {position: relative; display: inline-block; cursor: pointer; overflow: visible;}
  .tooltip .tooltiptext {
    visibility: hidden;
    width: max-content;
    max-width: 1000px;
    background-color: #555;
    color: #fff;
    text-align: left;
    border-radius: 6px;
    padding: 5px 8px;
    position: absolute;
    z-index: 9999;
    bottom: 125%; 
    left: 50%;
    transform: translateX(-50%);
    opacity: 1;
    transition: opacity 0.3s;
    font-size: 12px;
    white-space: normal;
  }
  .tooltiptext { position: absolute !important; z-index: 2147483647 !important; }
  /* Minimal CSS for fixed tooltip */
  .tooltiptext-fixed { pointer-events: auto; white-space: normal; line-height: 1.25; }
  .tooltip, .match, .bracket-slot, .bracket-round, .bracket-side, .bracket-final-wrapper {
    overflow: visible !important;
    position: relative; /* required for correct stacking context */
  }
  .tooltip:hover .tooltiptext {visibility: visible; opacity: 1; z-index: 9999;}
  .tooltip-team {position: relative; font-size: 12px; max-width: 2000px;}
  .tooltip-header {display: flex; justify-content: space-between; margin-bottom: 6px; min-height: 55px; position: relative; width: 100%;}
  .tooltip-roster {max-height: 700px; overflow-y: visible; padding-right: 4px;}
  /* Fix off-center team code in tooltip header */
  .tooltip-header-centered { position: absolute; left: 50%; transform: translateX(-50%);
    width: 200px; /* matches crest visual width for true centering */ display: flex; flex-direction: column; align-items: center; 
    pointer-events: none; /* ensures centered block does not interfere with hover */ }
  .tooltip-header-centered strong {text-align: center; font-size: 14px;}
  .grid-2col {display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; row-gap: 6px;}
  .player-row {display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap;}
  .player-img {width: 60px; height: 60px; border-radius: 1px; object-fit:contain;}
  .player-num {font-weight: bold; width: 24px; text-align: right;}
  .player-name {flex: 1;}
  .pk-badge {
  position: absolute;
  top: 50%;
  right: 2px;  /* Slightly more space from edge */
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 30px;
  height: 60px;
  font-size: 9px;
  font-weight: 800;
  color: white;
  background: transparent;
  border: white;
  border-radius: transparent;
  padding: 0;
  box-shadow: none;  /* Makes it pop */
  opacity: 1;  /* Always visible */
  transition: opacity 0.3s ease;
  pointer-events: all;
  z-index: 100;
}
.pk-badge.active { opacity: 1 !important;  /* ← ENSURE IT SHOWS */ pointer-events: all; }
.pk-label {
  position: absolute;
  top: 3px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 6px;
  font-weight: 900;
  background: #c41e3a;
  color: white;
  padding: 1px 4px;
  border-radius: 4px;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.pk-row { height: 20px; width: 10%; display: flex; align-items: center; justify-content: center; background: transparent; }
.pk-top { top: 36px; }
.pk-bottom { bottom: 34px; }
.pk-top, .pk-bottom {
  display: flex;
  justify-content: center;
  align-items: center;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.pk-dash-aligned { font-size: 10px; color: #888; margin: 0 0 1px 0; font-weight: bold; }
.pk-circle {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: transparent;
  background: transparent;
  text-align: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
  color: #222;
  padding: 0;
  line-height: 15px; /* Perfect vertical center */
  flex: 0 0 15px;
  padding: 0; /* Kill any browser default padding */
  margin: 0;
  box-sizing: content-box;
  /* Kill all browser styling that breaks circles */
  -webkit-appearance: none !important;
  -moz-appearance: none !important;
  appearance: none !important;
  overflow: visible;
}
.pk-circle::-webkit-inner-spin-button,
.pk-circle::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.pk-circle:focus { border-color: #0066ff; background: white; box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.25); }
/* When PK badge is active → push score inputs left */
/* .bracket-slot:has(.pk-badge.active) .knockout-score-block { margin-right: 10px !important;   /* ← Extra breathing room */ }
/* Optional: Make the whole slot a bit wider only when needed */
/* .bracket-slot:has(.pk-badge.active) { padding-right: 25px !important; }
.pk-circle[type=number] { -moz-appearance: textfield;   /* Firefox */ }
.bracket-final .bracket-slot,
.bracket-bronze .bracket-slot {
    display: flex;
    flex-direction: column;
    justify-content: center; /* vertical center */
    height: 60px; /* keep your current height */
    gap: 4px; /* optional spacing between team rows */
    padding: 0 8px; /* adjust horizontal padding if needed */
    transform: translateY(1px); /* move everything down 1px */
    opacity: 1;
    pointer-events: auto;
}
.bracket-final .team-row, .bracket-bronze .team-row {width: 100%; display: flex; align-items: center; /* vertically centers content within the row */ justify-content: center; /* horizontally center content as a whole */ flex: 0 0 auto; /* don't shrink when content changes */ box-sizing: border-box; min-width: 0; /* tune this number to what looks best */ }
.bracket-slot.q1 {background: rgba(255, 228, 90, 0.35); border-left: 4px solid rgba(230, 190, 40, 0.85); border-radius: 8px; }
.bracket-slot.q2 {background: rgba(255, 120, 120, 0.35); border-left: 4px solid rgba(220, 60, 60, 0.85); border-radius: 8px; }
.bracket-slot.q3 {background: rgba(120, 160, 255, 0.35); border-left: 4px solid rgba(60, 110, 230, 0.85); border-radius: 8px; }
.bracket-slot.q4 {background: rgba(120, 255, 160, 0.35); border-left: 4px solid rgba(40, 200, 110, 0.85); border-radius: 8px; }
.brand-badge {
  color: #a1a1a1;            /* text color (Tailwind gray-500ish) */
  font-family: "Nunito";
  font-weight: 900;            /* bold */
  font-style: italic;          /* italic */
  letter-spacing: 0.06em;      /* subtle tracking */
  text-decoration: none;       /* no underline */
}
/* Simple utility */
.hidden { display: none !important; }
/* Top-right index menu */
.index-menu {
  position: fixed;
  top: 12px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  z-index: 1100; /* Above tooltips, etc. */
}
.index-menu .index-label { font-weight: 600; } 
.index-menu select { font-size: 13px; padding: 2px 6px; }
/* Popup modal */
.info-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1200;
}
.info-modal {
  background: #ffffff;
  border-radius: 8px;
  padding: 16px 20px;
  max-width: 420px;
  width: 90%;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  position: relative;
}
.info-modal h3 { margin: 0 0 8px; font-size: 16px; }
.info-modal p { margin: 0; font-size: 14px; line-height: 1.4; }
.info-modal-close {
  position: absolute;
  top: 6px;
  right: 8px;
  border: none;
  background: transparent;
  font-size: 18px;
  cursor: pointer;
}
.stage-probs-container { margin-top: 10px; }
.stage-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.stage-table th,
.stage-table td { padding: 4px 6px; border-bottom: 1px solid #eee; text-align: left; }
.stage-table th { font-weight: 600; background: #f4f5f8; }
.stage-bar { position: relative; height: 14px; background: #f2f2f7; border-radius: 7px; overflow: hidden;}
.stage-bar-fill { position: absolute; top: 0; left: 0; bottom: 0; /* You can tweak this color */ background: #4a90e2; }
.stage-bar-label {position: relative; font-size: 11px; margin-left: 4px; }
/* Ensure bracket slots can position the Details button */
.bracket-slot { position: relative; }
/* Small floating "Details" button inside each knockout card */
.match-detail-btn {
  position: absolute;
  bottom: 2px;
  right: 2px;
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 4px;
  border: 1px solid #d0d4e0;
  background: #000000;
  cursor: pointer;
  width: 15px;
  margin-right: 24px;
}
.match-detail-btn:hover { background: #ff0e0e; }
.xg-line { font-size: 10px; color: #777; margin-top: 2px; }
/* Roster Manager Styles */
.mgr-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 15px;
    border-bottom: 1px solid #f0f0f0;
    background: #fff;
    transition: background 0.2s;
}
.mgr-row:hover { background: #f9fafb; }
.mgr-row:last-child { border-bottom: none; }

.mgr-info { display: flex; align-items: center; gap: 12px; flex: 1; }
.mgr-num { 
    font-weight: bold; color: #9ca3af; font-size: 12px; width: 25px; text-align:center; 
}
.mgr-name { 
    font-weight: 600; font-size: 14px; color: #374151;
}
.mgr-controls { display: flex; gap: 6px; }

.mgr-btn {
    border: 1px solid #86efac;  /* Green border */
    background: #f0fdf4;        /* Very light green background */
    color: #166534;             /* Dark green text */
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    transition: all 0.15s ease;
    min-width: 85px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}
.mgr-btn:hover { 
    background: #dcfce7;        /* Slightly darker green on hover */
    border-color: #4ade80;
}
/* Active States */
.mgr-btn.injured.active {
    background: #fee2e2; 
    border-color: #ef4444; 
    color: #b91c1c;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
}
.mgr-btn.suspended.active {
    background: #fef3c7; 
    border-color: #f59e0b; 
    color: #92400e;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
}
.new-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-left: 6px; 
  margin-right: 2px;
  flex-shrink: 0;
}

</style>
